openapi: 3.1.0
info:
  title: Slinga Route API
  description: >
    Target-distance running & walking route finder. Generates ranked loop and
    out-and-back candidates near a start point (see PLANNING.md §3–§5).
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service and engine health
      responses:
        '200':
          description: Health status (status "degraded" when the routing engine is unreachable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/routes/generate:
    post:
      operationId: generateRoutes
      summary: Generate ranked route candidates for a target distance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRoutesRequest'
      responses:
        '200':
          description: Ranked candidates (possibly empty, with nearest misses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRoutesResponse'
        '400':
          description: Invalid request
        '503':
          description: Routing engine unavailable
  /v1/routes/{id}/gpx:
    get:
      operationId: getRouteGpx
      summary: GPX export of a previously generated candidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GPX 1.1 document
          content:
            application/gpx+xml:
              schema:
                type: string
        '404':
          description: Unknown or expired route id
components:
  schemas:
    GenerateRoutesRequest:
      type: object
      required: [start, distanceM]
      properties:
        start:
          type: object
          required: [lon, lat]
          properties:
            lon: { type: number, minimum: -180, maximum: 180 }
            lat: { type: number, minimum: -90, maximum: 90 }
        distanceM: { type: number, minimum: 1000, maximum: 50000 }
        routeType: { type: string, enum: [loop, out_and_back, either], default: loop }
        soft:
          type: object
          properties:
            surface: { type: string, enum: [paved, unpaved, any], default: any }
            avoidSteps: { type: boolean, default: false }
        fresh: { type: boolean, default: false }
    Candidate:
      type: object
      properties:
        id: { type: string }
        routeType: { type: string, enum: [loop, out_and_back] }
        coordinates:
          type: array
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 3
        distanceM: { type: number }
        distanceErrorRatio: { type: number }
        withinTolerance: { type: boolean }
        score: { type: number }
        repeatedEdgeShare: { type: number }
        unknownSurfaceShare: { type: number }
        surfaceBreakdown:
          type: object
          additionalProperties: { type: number }
        ascendM: { type: number }
        descendM: { type: number }
        gpxPath: { type: string }
    GenerateRoutesResponse:
      type: object
      properties:
        target:
          type: object
          properties:
            distanceM: { type: number }
            tolerance: { type: number }
        hasValidCandidate: { type: boolean }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        nearestMisses:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }
        cached: { type: boolean }
    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        engine:
          type: object
          properties:
            reachable: { type: boolean }
            kind: { type: string }
        uptimeS: { type: number }
        version: { type: string }
